site_name: RoboTest Studio
site_description: Visual Appian test authoring, review and execution for business users.
site_url: https://dinilmithra.github.io/robo-test-studio-docs/
repo_url: https://github.com/dinilmithra/robo-test-studio-docs
copyright: Copyright &copy; 2026 Dinil Mithra
extra_css:
  - stylesheets/studio.css
extra:
  generator: false
theme:
  name: material
  icon:
    logo: material/test-tube
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
nav:
  - Home: index.md
  - Get Started: getting-started.md
  - Record & Review: guide.md
  - Execute: execution.md
  - Evidence: evidence.md
  - Recorder Features: api.md
  - License: license.md
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight
  - toc
