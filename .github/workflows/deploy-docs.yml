name: Deploy public documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v6
      - name: Install Poetry tooling
        run: python -m pip install poetry==2.5.1
      - name: Install documentation dependencies through Poetry
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: 'true'
        run: |
          if [ ! -f poetry.lock ]; then poetry lock; fi
          poetry check --lock
          poetry install --no-interaction
      - name: Build public documentation
        run: poetry run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '### Documentation published\n\n[Open documentation](%s)\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
